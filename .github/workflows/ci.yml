name: CI

# CI untuk Suka Video (repo #35 — situs statis + Cloudflare Pages
# Worker tanpa dependensi produksi).
# Job: build dist/ (public/* + worker/_worker.js), unit test worker
# (node:test), pemeriksaan statis (tautan + secret + gate anti-slop P0),
# advisory-sweep OSV (produksi saja — di repo ini nol paket produksi),
# Playwright e2e terhadap serve-worker lokal, dan smoke folder dist/
# (persis yang di-deploy ke Cloudflare Pages).
# Node 24 (engines.node >= 22 dikunci di package.json mengikuti pola #29).
# JANGAN `npx playwright install` di VM dev — hanya di CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build dist/ ────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (public/* + worker -> dist/)
        run: npm run build

      - name: Pastikan dist/ berisi situs + worker
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/style.css
          test -f dist/favicon.svg
          test -f dist/_worker.js

  # ── Unit test worker ───────────────────────────────────────────────────
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: node:test worker (token leofame + endpoint /api/*)
        run: npm test

  # ── Pemeriksaan statis ─────────────────────────────────────────────────
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tautan + secret + gate P0 + sisa Vercel
        run: npm run validate

  # ── Advisory sweep (OSV batch, tanpa auth) ────────────────────────────
  # Pola repo #24–#34: 1 POST ke api.osv.dev/v1/querybatch untuk semua
  # paket produksi. JANGAN ganti ke GitHub Advisory DB API + GITHUB_TOKEN
  # (gagal deterministik 401 di CI orteam — token per-job bermasalah).
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OSV sweep (produksi saja, HIGH/CRITICAL = gagal)
        run: python3 scripts/advisory-sweep.py

  # ── Playwright e2e terhadap serve-worker lokal ────────────────────────
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (hanya di CI — JANGAN di VM dev)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Jalankan e2e (desktop + mobile)
        run: npx playwright test

  # ── Smoke folder dist/ ─────────────────────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + smoke dist/
        run: |
          npm run build
          npm run smoke
